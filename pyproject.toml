[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Himanshu Giri", email = "66942475-girihimanshu540@users.noreply.replit.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.162.2",
    "google-cloud-storage>=3.17.1",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.1",
    "openai>=3.46.0",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.8",
    "pyjwt>=2.15.1",
    "pytest>=9.2.0",
    "python-multipart>=0.0.33",
    "scikit-image>=0.26.0",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.54.0",
]

[project.scripts]
repl-nix-workspace = "repl_nix_workspace:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
